<!-- ==========================================================================
     [LOCAL HOST & PRODUCTION] Mobile-Optimized Edit Student Record Template
     ========================================================================== -->

<div class="dashboard-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="edit-student-container">
      
      <!-- Back Breadcrumb / Header -->
      <div class="page-header">
        <a routerLink="/students" class="back-link">
          ← Back to Student Directory
        </a>
        <h1 class="page-title">Edit Student Record</h1>
        <p class="page-subtitle">Update academic details or marks for the enrolled student.</p>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-card">
        Loading student information...
      </div>

      <!-- Form Card -->
      <div *ngIf="!isLoading" class="data-card">
        
        <!-- Error Banner Pop-up -->
        <div *ngIf="errorMessage" class="error-banner">
          ⚠️ {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit(studentForm)" #studentForm="ngForm" novalidate>

          <!-- Student Name -->
          <div class="form-group">
            <label class="form-label">Student Full Name</label>
            <input 
              type="text" 
              name="name" 
              [(ngModel)]="studentData.name" 
              placeholder="e.g. Rahul Sharma"
              class="form-control">

            <span *ngIf="fieldErrors['name']" class="field-error">
              {{ fieldErrors['name'] }}
            </span>
          </div>

          <!-- Department Dropdown -->
          <div class="form-group">
            <label class="form-label">Department</label>
            <select 
              name="departmentId" 
              [(ngModel)]="studentData.departmentId" 
              class="form-control cursor-pointer">
              <option [ngValue]="''" disabled>Select a department</option>
              <option *ngFor="let dept of departments" [ngValue]="dept.id">{{ dept.name }}</option>
            </select>
          
            <span *ngIf="fieldErrors['departmentId']" class="field-error">
              {{ fieldErrors['departmentId'] }}
            </span>
          </div>

          <!-- [NEW ADDITION] Responsive Two-Column Grid for Semester and Mark -->
          <div class="responsive-grid">
            
            <!-- Dynamic Semester Input -->
            <div class="form-group">
              <label class="form-label">
                Semester 
                <span class="label-range">(Range: {{ config().minSemester }} - {{ config().maxSemester }})</span>
              </label>
              <input 
                type="number" 
                name="semester" 
                [(ngModel)]="studentData.semester" 
                [placeholder]="'Range: ' + config().minSemester + ' to ' + config().maxSemester"
                class="form-control">

              <span *ngIf="fieldErrors['semester']" class="field-error">
                {{ fieldErrors['semester'] }}
              </span>
            </div>

            <!-- Dynamic Mark Input -->
            <div class="form-group">
              <label class="form-label">
                Marks / Score 
                <span class="label-range">(Range: {{ config().minMarks }} - {{ config().maxMarks }})</span>
              </label>
              <input 
                type="number" 
                name="marks" 
                [(ngModel)]="studentData.marks" 
                [placeholder]="'Range: ' + config().minMarks + ' to ' + config().maxMarks"
                class="form-control">

              <span *ngIf="fieldErrors['marks']" class="field-error">
                {{ fieldErrors['marks'] }}
              </span>
            </div>

          </div>

          <!-- [NEW ADDITION] Responsive Action Buttons Footer -->
          <div class="form-footer">
            <button 
              type="button" 
              routerLink="/students"
              class="btn-cancel">
              Cancel
            </button>
            
            <button 
              type="submit" 
              [disabled]="isSubmitting"
              class="btn-submit">
              {{ isSubmitting ? 'Updating...' : 'Update Student' }}
            </button>
          </div>

        </form>

      </div>
    </div>
  </main>
</div>
