<div class="dashboard-layout">
  <!-- Reusable Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="settings-page-container" style="padding: 2.5rem; max-width: 800px; margin: 0 auto; font-family: 'Proxima Nova', sans-serif;">
      
      <!-- Page Header -->
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.25rem; font-weight: 400; color: #2C221E; margin: 0; font-family: serif;">System Settings</h1>
        <p style="color: #7A6B63; font-size: 0.95rem; margin-top: 0.25rem;">Configure dynamic validation rules and constraints for application forms.</p>
      </div>

      <!-- Settings Form Card -->
      <div class="data-card" style="background: #FFFFFF; border-radius: 12px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); border: 1px solid rgba(0,0,0,0.04);">
        
        <h2 style="font-size: 1.25rem; font-weight: 500; color: #2C221E; margin-top: 0; margin-bottom: 1.5rem; font-family: serif;">Add Student Form Rules</h2>

        <!-- Alert Banners -->
        <div *ngIf="errorMessage" style="background: #FFF1F0; border: 1px solid #FFCCC7; color: #E5484D; padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
          {{ errorMessage }}
        </div>

        <div *ngIf="isSaved" style="background: #F6FFED; border: 1px solid #B7EB8F; color: #52C41A; padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
          ✓ Form configuration rules updated successfully!
        </div>

        <form (ngSubmit)="onSave()" #configForm="ngForm">

          <!-- Semester Bounds Section -->
          <div style="margin-bottom: 2rem;">
            <label style="display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #2C221E; margin-bottom: 1rem; font-weight: 600;">Semester Limits</label>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              <div>
                <label style="display: block; font-size: 0.8rem; color: #7A6B63; margin-bottom: 0.4rem; font-weight: 500;">Minimum Semester</label>
                <input 
                  type="number" 
                  name="minSemester" 
                  [(ngModel)]="studentConfig.minSemester" 
                  required
                  style="width: 100%; padding: 0.85rem 1rem; border: 1px solid #E2D9D2; border-radius: 8px; font-size: 1rem; background: #FAFAFA; color: #2C221E; outline: none;">
              </div>

              <div>
                <label style="display: block; font-size: 0.8rem; color: #7A6B63; margin-bottom: 0.4rem; font-weight: 500;">Maximum Semester</label>
                <input 
                  type="number" 
                  name="maxSemester" 
                  [(ngModel)]="studentConfig.maxSemester" 
                  required
                  style="width: 100%; padding: 0.85rem 1rem; border: 1px solid #E2D9D2; border-radius: 8px; font-size: 1rem; background: #FAFAFA; color: #2C221E; outline: none;">
              </div>
            </div>
          </div>

          <!-- Marks Bounds Section -->
          <div style="margin-bottom: 2.5rem;">
            <label style="display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #2C221E; margin-bottom: 1rem; font-weight: 600;">Marks / Score Range</label>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              <div>
                <label style="display: block; font-size: 0.8rem; color: #7A6B63; margin-bottom: 0.4rem; font-weight: 500;">Minimum Score</label>
                <input 
                  type="number" 
                  name="minMarks" 
                  [(ngModel)]="studentConfig.minMarks" 
                  required
                  style="width: 100%; padding: 0.85rem 1rem; border: 1px solid #E2D9D2; border-radius: 8px; font-size: 1rem; background: #FAFAFA; color: #2C221E; outline: none;">
              </div>

              <div>
                <label style="display: block; font-size: 0.8rem; color: #7A6B63; margin-bottom: 0.4rem; font-weight: 500;">Maximum Score</label>
                <input 
                  type="number" 
                  name="maxMarks" 
                  [(ngModel)]="studentConfig.maxMarks" 
                  required
                  style="width: 100%; padding: 0.85rem 1rem; border: 1px solid #E2D9D2; border-radius: 8px; font-size: 1rem; background: #FAFAFA; color: #2C221E; outline: none;">
              </div>
            </div>
          </div>

          <!-- Actions Footer -->
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 1.5rem;">
            <button 
              type="button" 
              (click)="onReset()"
              style="padding: 0.75rem 1.25rem; border-radius: 8px; border: 1px solid #E2D9D2; background: transparent; color: #7A6B63; font-weight: 600; cursor: pointer; font-size: 0.9rem;">
              Reset Defaults
            </button>
            
            <button 
              type="submit" 
              [disabled]="!configForm.form.valid"
              style="padding: 0.75rem 2rem; border-radius: 8px; border: none; background: #C27835; color: #FFFFFF; font-weight: 600; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(194, 120, 53, 0.25);">
              Save Configuration
            </button>
          </div>

        </form>

      </div>
    </div>
  </main>
</div>
