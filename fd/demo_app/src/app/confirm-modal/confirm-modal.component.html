<div *ngIf="confirmService.isOpen()" class="modal-overlay" (click)="confirmService.onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-icon">
      <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </div>

    <div class="modal-content">
      <h3>{{ confirmService.config().title }}</h3>
      <p>{{ confirmService.config().message }}</p>
    </div>

    <div class="modal-actions">
        <button 
        *ngIf="!confirmService.config().isAlert" 
        type="button" 
        class="btn-cancel" 
        (click)="confirmService.onCancel()">
        {{ confirmService.config().cancelText }}
        </button>
        <button type="button" class="btn-confirm" (click)="confirmService.onConfirm()">
        {{ confirmService.config().confirmText }}
      </button>
    </div>

  </div>
</div>
