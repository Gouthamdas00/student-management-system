<div class="dashboard-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="add-department-container" style="padding: 2.5rem; max-width: 800px; margin: 0 auto; font-family: 'Proxima Nova', sans-serif;">
      
      <!-- Back Breadcrumb / Header -->
      <div style="margin-bottom: 2rem;">
        <a routerLink="/departments" style="text-decoration: none; color: #8C6D53; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
          ← Back to Departments
        </a>
        <h1 style="font-size: 2.25rem; font-weight: 400; color: #2C221E; margin: 0; font-family: serif;">Edit Department</h1>
        <p style="color: #7A6B63; font-size: 0.95rem; margin-top: 0.25rem;">Update department name or reassign Head of Department details.</p>
      </div>

      <!-- Loading Spinner State -->
      <div *ngIf="isLoading" style="background: #FFFFFF; border-radius: 12px; padding: 3rem; text-align: center; color: #7A6B63;">
        Loading department details...
      </div>

      <!-- Form Card -->
      <div *ngIf="!isLoading" class="data-card" style="background: #FFFFFF; border-radius: 12px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); border: 1px solid rgba(0,0,0,0.04);">
        
        <!-- Error Banner Pop-up -->
        <div *ngIf="errorMessage" style="background: #FFF1F0; border: 1px solid #FFCCC7; color: #E5484D; padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; font-weight: 500;">
          ⚠️ {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit(departmentForm)" #departmentForm="ngForm" novalidate>

          <!-- Department Name -->
          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #7A6B63; margin-bottom: 0.5rem; font-weight: 600;">Department Name</label>
            <input 
              type="text" 
              name="name" 
              [(ngModel)]="departmentData.name" 
              placeholder="e.g. Computer Science and Engineering"
              style="width: 100%; padding: 0.85rem 1rem; border: 1px solid #E2D9D2; border-radius: 8px; font-size: 1rem; background: #FAFAFA; color: #2C221E; outline: none;"
              onfocus="this.style.borderColor='#C27835'" 
              onblur="this.style.borderColor='#E2D9D2'">

            <span *ngIf="fieldErrors['name']" style="color: #E5484D; font-size: 0.8rem; margin-top: 0.35rem; display: block; font-weight: 500;">
              {{ fieldErrors['name'] }}
            </span>
          </div>

          <!-- Head of Department -->
          <div style="margin-bottom: 2rem;">
            <label style="display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #7A6B63; margin-bottom: 0.5rem; font-weight: 600;">Head of Department (H.O.D)</label>
            <input 
              type="text" 
              name="headOfDepartment" 
              [(ngModel)]="departmentData.headOfDepartment" 
              placeholder="e.g. Dr. Jane Smith"
              style="width: 100%; padding: 0.85rem 1rem; border: 1px solid #E2D9D2; border-radius: 8px; font-size: 1rem; background: #FAFAFA; color: #2C221E; outline: none;"
              onfocus="this.style.borderColor='#C27835'" 
              onblur="this.style.borderColor='#E2D9D2'">

            <span *ngIf="fieldErrors['headOfDepartment']" style="color: #E5484D; font-size: 0.8rem; margin-top: 0.35rem; display: block; font-weight: 500;">
              {{ fieldErrors['headOfDepartment'] }}
            </span>
          </div>

          <!-- Action Buttons Footer -->
          <div style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 1.5rem;">
            <button 
              type="button" 
              routerLink="/departments"
              style="padding: 0.75rem 1.5rem; border-radius: 8px; border: 1px solid #E2D9D2; background: transparent; color: #7A6B63; font-weight: 600; cursor: pointer; font-size: 0.95rem;">
              Cancel
            </button>
            
            <button 
              type="submit" 
              [disabled]="isSubmitting"
              style="padding: 0.75rem 2rem; border-radius: 8px; border: none; background: #C27835; color: #FFFFFF; font-weight: 600; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(194, 120, 53, 0.25);">
              {{ isSubmitting ? 'Updating...' : 'Update Department' }}
            </button>
          </div>

        </form>

      </div>
    </div>
  </main>
</div>
